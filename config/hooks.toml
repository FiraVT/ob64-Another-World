# Code the app inserts into the generated C, applied by tools/apply_hooks.py
# after every regeneration (`make recomp`, `make bank-recomp`, `make rev0`).
#
# rom     the ROM address of the anchor's instruction: the game's own name for
#         the code, the same in any N64Recomp-based build of revision 1. The
#         tool finds which generated unit holds it (tools/n64map.py); a hook may
#         still name `unit` (main or a bank letter) instead.
# anchor  revision 1 text that occurs exactly once in the unit; `@@` marks where
#         `code` goes. For revision 0 the tool moves every address in it
#         (`0x8XXXXXXX`, `L_8XXXXXXX`) by the rule in docs/anotherworld/notes-revisions.md.
# anchor_rev0  optional: the revision 0 anchor, where the rule cannot derive it
#         (a changed function, or an address split into an instruction operand)
# code    inserted text; its first line is the marker that makes applying idempotent
# decls   C prototypes, written once before the function that holds the anchor

[[hook]]
name = "mission load event (802164E0)"
rom = 0x196970
anchor = '''
@@    // 0x802164E0: lw          $t2, 0x34($sp)
'''
# Revision 0: the loader is one of the changed functions; the same `lw` follows
# the same `jal 0x8007938C` (opening enemydat.bin) 0x20 later.
anchor_rev0 = '''
@@    // 0x80216500: lw          $t2, 0x34($sp)
'''
code = '''
    // game event 1, mission load: templates, spawn list (app/features/game_events.hpp).
    ogre_event(rdram, ctx, 1, (uint32_t)ctx->r2, (uint32_t)MEM_W(ctx->r29, 0X34));
'''
decls = ["void ogre_event(uint8_t* rdram, recomp_context* ctx, uint32_t event, uint32_t a0, uint32_t a1)"]

