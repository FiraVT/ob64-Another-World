[[hook]]
name = "idle wait (8007F998)"
rom = 0x00FD98
# The idle thread. Thread 1's entry, func_8007F8E4, starts thread 3
# (func_80071EB0), drops its own priority to 0, and then loops forever at
# 0x8007F968..0x8007F99C: it reads an idle callback at 0x800E7A18, calls it when
# it is non-zero, and jumps back. Nothing in the ROM writes that word except the
# zeroing store at 0x8007F904. On hardware a priority-0 loop runs only when every
# other thread is blocked; here N64 threads are native threads, so the loop held
# a whole host core. The hook sleeps the native thread for about a millisecond
# per pass (app/src/overlays.cpp); the loop still re-reads the callback and
# still calls it when it is set. It does not use yield_self: that put the idle
# thread into the N64 scheduler's running queue, and one boot in four froze at
# the publishers -> title transition. Found by frankjniu
# (ogre-battle-64-recomp-windows, commit e980749): a 30 s boot went from 34 s
# to 4 s of CPU.
anchor = '''
@@    // 0x8007F998: j           L_8007F968
'''
code = '''
    // IDLE WAIT: the idle loop sleeps about 1 ms per pass (8007F998, app/src/overlays.cpp).
    ogre_idle_wait(rdram);
'''
decls = ["void ogre_idle_wait(uint8_t* rdram)"]

