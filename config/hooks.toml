    // battle labels: a port label instead of a game effect (801E34F8, app/features/battle_labels.cpp).
    if (ogre_battle_label(rdram, ctx, (uint32_t)ctx->r4, (uint32_t)ctx->r5, (uint32_t)ctx->r6)) { ctx->r2 = 0; return; }
'''
decls = ["int ogre_battle_label(uint8_t* rdram, recomp_context* ctx, uint32_t fighter, uint32_t kind, uint32_t value)"]
